[package]
name = "suffice"
version = "0.3.0"
description = "Suffice is a terminal-based tool for controlling a cycling trainer, so you can pound pedals while peddling code."
keywords = ["bluetooth", "tui", "cycling"]
categories = ["command-line-utilities"]
repository = "https://github.com/frenata/suffice"
readme = "README.md"
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.21.0", features = ["v4"] }
btleplug = "0.11.8"
tokio-stream = "0.1.18"
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
fixed_deque = "1.6.0"
average = "0.16.0"
rustyfit = "0.4.0"
chrono = "0.4.44"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
derivative = "2.2.0"
clap = { version = "4.5.60", features = ["derive"] }
async-stream = "0.3.6"
rand = "0.10.0"
tracing-appender = "0.2.4"

[dev-dependencies]
mockall = "0.14.0"
