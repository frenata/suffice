[package]
repository = "https://github.com/frenata/suffice"
readme = "README.md"
name = "suffice"
description = "Suffice is a terminal-based tool for controlling a cycling trainer, so you can pound pedals while peddling code."
license = "AGPL"
keywords = ["bluetooth", "tui", "cycling"]
categories = ["command-line-utilities"]
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.21.0", features = ["v4"] }
btleplug = "0.11.8"
tokio-stream = "0.1.18"
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
fixed_deque = "1.6.0"
average = "0.16.0"
